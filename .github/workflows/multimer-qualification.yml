name: Qualify Multimer on Apple Silicon

on:
  workflow_dispatch:
    inputs:
      qualification_release:
        description: Draft release containing the f32, f16, and reference archives
        required: true
        default: model1-multimer-v3-qualification-v1

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chrome qualification runtime
        run: npx playwright install chromium
      - name: Record Apple GPU
        run: system_profiler SPHardwareDataType SPDisplaysDataType
      - name: Download qualification inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.qualification_release }}
        run: |
          mkdir -p "$RUNNER_TEMP/qualification"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/qualification" \
            --pattern afwebgpu-model1-multimer-v3-f32-v2.tar.gz \
            --pattern afwebgpu-model1-multimer-v3-f16-v1.tar.gz \
            --pattern afwebgpu-multimer-references-v2.tar.gz
          tar -xzf "$RUNNER_TEMP/qualification/afwebgpu-model1-multimer-v3-f32-v2.tar.gz" -C "$RUNNER_TEMP/qualification"
          tar -xzf "$RUNNER_TEMP/qualification/afwebgpu-model1-multimer-v3-f16-v1.tar.gz" -C "$RUNNER_TEMP/qualification"
          tar -xzf "$RUNNER_TEMP/qualification/afwebgpu-multimer-references-v2.tar.gz" -C "$RUNNER_TEMP/qualification"
      - name: Verify model shards
        run: |
          npm run verify:web-model -- "$RUNNER_TEMP/qualification/afwebgpu-multimer-model1-f32-v2/manifest.json" --require-sha256
          npm run verify:web-model -- "$RUNNER_TEMP/qualification/model-multimer/manifest.json" --require-sha256
      - name: Compare official JAX, Chrome WebGPU f32, and Chrome WebGPU f16
        env:
          AFWEBGPU_BROWSER_MULTIMER_QUALIFICATION: "1"
          AFWEBGPU_QUALIFICATION_ASSET_ROOT: ${{ runner.temp }}/qualification
        run: >-
          npx playwright test
          test/browser/multimer-qualification.spec.ts
          test/browser/multimer-homodimer-prediction.spec.ts
          --workers=1
