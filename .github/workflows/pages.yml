name: Deploy WebGPU demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Add the single model-1 PTM release bundle
        if: ${{ vars.AFWEBGPU_INCLUDE_MODEL == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model1-ptm --pattern afwebgpu-model1-ptm.tar.gz
          tar -xzf afwebgpu-model1-ptm.tar.gz -C dist/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
