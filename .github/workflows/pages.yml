name: Deploy WebGPU demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AFWEBGPU_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Add the qualified q8 model-1 PTM release bundle
        if: ${{ vars.AFWEBGPU_INCLUDE_MODEL == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model1-ptm-q8-v1 --pattern afwebgpu-model1-ptm-q8-v1.tar.gz
          tar -xzf afwebgpu-model1-ptm-q8-v1.tar.gz -C dist/web
      - name: Validate model bundle
        if: ${{ vars.AFWEBGPU_INCLUDE_MODEL == 'true' }}
        run: npm run verify:web-model -- dist/web/model/manifest.json --require-sha256 --require-license
      - name: Add AlphaFold-Multimer-v3 model 1 f16 bundle
        if: ${{ vars.AFWEBGPU_INCLUDE_MULTIMER_MODEL == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model1-multimer-v3-f16-v1 --pattern afwebgpu-model1-multimer-v3-f16-v1.tar.gz
          tar -xzf afwebgpu-model1-multimer-v3-f16-v1.tar.gz -C dist/web
      - name: Validate Multimer model bundle
        if: ${{ vars.AFWEBGPU_INCLUDE_MULTIMER_MODEL == 'true' }}
        run: npm run verify:web-model -- dist/web/model-multimer/manifest.json --require-sha256 --require-license
      - uses: actions/configure-pages@v5
      - name: Validate Pages artifact size
        run: npm run verify:pages-size
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
